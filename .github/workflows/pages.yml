name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Public browser settings only. Missing variables allow résumé deployment
      # and Radar shows its setup error. Invalid values fail the entire deploy;
      # Pages continues serving the last successful deployment.
      - name: Generate Prospect Tracker public configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BRANDFETCH_CLIENT_ID: ${{ vars.BRANDFETCH_CLIENT_ID }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            node tools/prospect-tracker/scripts/generate-public-config.js
          else
            echo "::notice::Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository variables to enable Prospect Tracker."
          fi

      # Keep existing URLs, but exclude local prototypes and untracked files.
      # upload-pages-artifact dereferences symlinks; the prototype node_modules
      # link points outside the runner checkout and previously broke deployment.
      - name: Validate Pages artifact preparation
        run: node --test tools/prospect-tracker/tests/pages-artifact.test.js

      - name: Prepare Pages artifact
        run: node tools/prospect-tracker/scripts/prepare-pages.mjs "$RUNNER_TEMP/nextchapter-pages"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/nextchapter-pages

      - id: deployment
        uses: actions/deploy-pages@v4
